name: Autograding

# Roda a cada push (e manualmente). Corrige a conformidade da API (comportamento).
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  autograding:
    runs-on: ubuntu-latest
    env:
      # Banco SQLite do CI (o .env não vai para o git). Caminho relativo à pasta prisma/.
      DATABASE_URL: file:./dev.db
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependências
        run: npm install --no-audit --no-fund

      # O Prisma Client é gerado no postinstall; aqui só criamos o banco a partir das migrations.
      - name: Aplicar migrations
        run: npx prisma migrate deploy

      - name: Subir o servidor
        run: |
          PORT=3000 npm start &
          sleep 2

      - name: Corrigir (autograder de conformidade)
        run: BASE_URL=http://localhost:3000 node autograder/check.mjs
